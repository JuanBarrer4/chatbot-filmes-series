<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinebot: Filmes e Séries</title>
    <style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

  /* FOTO DE FUNDO DA PÁGINA (Rota padrão do Flask via /static/) */
  background-image: url('/static/imagens/cinema.webp');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;

  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 800px;
  height: 600px;

  border-radius: 15px;
  overflow: hidden;

  display: flex;
  flex-direction: column;

  background-image:
    linear-gradient(rgba(255,255,255,0.75), rgba(255,255,255,0.75)),
    url('/static/imagens/cinema.webp');

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  box-shadow: 0 10px 40px rgba(0,0,0,.4);
}

.header {
  /* FOTO NO TOPO COM GRADIENTE ESCURO POR CIMA */
  background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.8)), url('/static/imagens/cinema.webp');
  background-size: cover;
  background-position: center 30%;
  background-repeat: no-repeat;
  
  color: white;
  padding: 25px 20px;
  text-align: center;
  border-bottom: 2px solid #b30000;
}

.header h1 {
  font-size: 28px;
  margin-bottom: 5px;
  text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
}

.header p {
  font-size: 14px;
  opacity: .9;
  text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
}

.chat-box {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;

  background: transparent;
}

.message {
  display: flex;
  margin-bottom: 15px;
  animation: slideIn .3s ease-out;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.message.user {
  justify-content: flex-end;
}

.message.bot {
  justify-content: flex-start;
}

.message-content {
  max-width: 70%;
  padding: 12px 16px;
  border-radius: 12px;
  word-wrap: break-word;
  white-space: pre-wrap;
  line-height: 1.4;
}

.message.user .message-content {
  background: #c62828;
  color: white;
  border-bottom-right-radius: 0;
}

.message.bot .message-content {
  background: rgba(255,255,255,.95);
  color: #222;
  border-bottom-left-radius: 0;
}

.loading {
  display: flex;
  gap: 5px;
  align-items: center;
}

.loading span {
  width: 8px;
  height: 8px;
  background: #b30000;
  border-radius: 50%;
  animation: bounce 1.4s infinite;
}

.loading span:nth-child(2) {
  animation-delay: .2s;
}

.loading span:nth-child(3) {
  animation-delay: .4s;
}

@keyframes bounce {
  0%,80%,100% {
    transform: scale(0);
    opacity: .5;
  }
  40% {
    transform: scale(1);
    opacity: 1;
  }
}

.input-area {
  display: flex;
  gap: 10px;
  padding: 15px;
  background: rgba(255,255,255,.95);
  border-top: 1px solid #ddd;
}

#messageInput {
  flex: 1;
  padding: 12px 15px;
  border: 1px solid #ccc;
  border-radius: 25px;
  font-size: 14px;
  outline: none;
}

#messageInput:focus {
  border-color: #b30000;
}

#sendBtn {
  padding: 12px 30px;
  background: #b30000;
  color: white;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
}

#sendBtn:hover {
  background: #7a0000;
}

#sendBtn:disabled {
  background: #999;
  cursor: not-allowed;
}
</style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🎬 Cinebot: Filmes e Séries</h1>
        <p>Me pergunte sobre seus filmes e séries favoritos!</p>
      </div>

      <div class="chat-box" id="chatBox"></div>

      <div class="input-area">
        <input
          type="text"
          id="messageInput"
          placeholder="Me pergunte sobre filmes e séries..."
          autofocus
        />
        <button id="sendBtn">Enviar</button>
      </div>
    </div>

    <script>
      const chatBox = document.getElementById('chatBox')
      const messageInput = document.getElementById('messageInput')
      const sendBtn = document.getElementById('sendBtn')

      function formatarMensagem(texto) {
        if (!texto) return '';
        let textoFormatado = texto.replace(/\n/g, '<br>');
        textoFormatado = textoFormatado.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        return textoFormatado;
      }

      function addMessage(text, isUser) {
        const messageDiv = document.createElement('div')
        messageDiv.className = `message ${isUser ? 'user' : 'bot'}`

        const content = document.createElement('div')
        content.className = 'message-content'
        content.innerHTML = text

        messageDiv.appendChild(content)
        chatBox.appendChild(messageDiv)
        chatBox.scrollTop = chatBox.scrollHeight
      }

      function addLoadingMessage() {
        const messageDiv = document.createElement('div')
        messageDiv.className = 'message bot'

        const content = document.createElement('div')
        content.className = 'message-content loading'
        content.id = 'loadingMessage'
        content.innerHTML = '<span></span><span></span><span></span>'

        messageDiv.appendChild(content)
        chatBox.appendChild(messageDiv)
        chatBox.scrollTop = chatBox.scrollHeight
      }

      function removeLoadingMessage() {
        const loading = document.getElementById('loadingMessage')
        if (loading) loading.parentElement.remove()
      }

      async function sendMessage() {
        const message = messageInput.value.trim()
        if (!message) return

        addMessage(message, true)
        messageInput.value = ''
        sendBtn.disabled = true

        addLoadingMessage()

        try {
          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ message })
          })

          const data = await response.json()
          removeLoadingMessage()

          if (data.response) {
            addMessage(formatarMensagem(data.response), false)
          } else {
            addMessage('Erro: ' + (data.error || 'Erro desconhecido'), false)
          }
        } catch (error) {
          removeLoadingMessage()
          addMessage('Erro ao conectar com servidor: ' + error.message, false)
        } finally {
          sendBtn.disabled = false
          messageInput.focus()
        }
      }

      sendBtn.addEventListener('click', sendMessage)
      messageInput.addEventListener('keypress', e => {
        if (e.key === 'Enter') sendMessage()
      })

      window.addEventListener('load', () => {
        addMessage(
          'Olá! 👋 Sou seu assistente de filmes e séries. Pergunte sobre qualquer filme ou série de minha base de dados. O que você busca?',
          false
        )
      })
    </script>
  </body>
</html>
